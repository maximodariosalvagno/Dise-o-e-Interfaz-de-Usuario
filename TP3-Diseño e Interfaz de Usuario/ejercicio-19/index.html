<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 19 - Formulario multi-step</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Registro en 2 pasos</h1>

  <form class="form-pasos" novalidate>
    <!-- radios ocultos que controlan que paso se ve, sin JavaScript -->
    <input type="radio" name="paso" id="ir-paso-1" class="control-paso" checked>
    <input type="radio" name="paso" id="ir-paso-2" class="control-paso">

    <section class="paso paso-1">
      <h2>Paso 1: datos personales</h2>
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required minlength="2" placeholder="Ej: Ana Perez">
      </div>
      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="tuemail@ejemplo.com">
      </div>
      <label for="ir-paso-2" class="boton-paso">Siguiente</label>
    </section>

    <section class="paso paso-2">
      <h2>Paso 2: datos de acceso</h2>
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required minlength="4" placeholder="Elegi un usuario">
      </div>
      <div class="campo">
        <label for="clave">Contrasena</label>
        <input type="password" id="clave" name="clave" required minlength="6" placeholder="Minimo 6 caracteres">
      </div>
      <label for="ir-paso-1" class="boton-paso boton-volver">Volver</label>
      <button type="submit">Registrarme</button>
    </section>
  </form>
</body>
</html>
